[workspace]
members = ["firmware", "crates/core", "crates/cora", "crates/verify"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ProductionDeck Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/MikanseiLaboratory/productiondeck"

[workspace.dependencies]
productiondeck-core = { path = "crates/core", default-features = false }

# Cargo build configuration
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = true
opt-level = 's'
overflow-checks = false

[profile.dev]
codegen-units = 1
debug = 2
incremental = false
opt-level = "z"
